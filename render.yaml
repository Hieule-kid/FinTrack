version: "1"
projects:
  - name: My project
    environments:
      - name: Production

        services:
          - type: web
            name: fintrack-config
            runtime: docker
            repo: https://github.com/Hieule-kid/FinTrack
            plan: free
            region: singapore
            dockerContext: .
            dockerfilePath: ./Dockerfile
            autoDeployTrigger: commit
            port: 8761
            envVars:
              - key: FINTRACK_DEV_ENV
                sync: false
              - key: EUREKA_USERNAME
                sync: false
              - key: EUREKA_PASSWORD
                sync: false
