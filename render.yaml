version: "1"
projects:
  - name: My project
    environments:
      - name: Production

        services:
          # ── Eureka / Config Service ───────────────────────────────────────────
          - type: web
            name: fintrack-config
            runtime: docker
            repo: https://github.com/Hieule-kid/FinTrack
            plan: free
            region: singapore
            dockerContext: .
            dockerfilePath: ./config-service/Dockerfile
            autoDeployTrigger: commit
            envVars:
              - key: FINTRACK_DEV_ENV
                sync: false
              - key: EUREKA_USERNAME
                sync: false
              - key: EUREKA_PASSWORD
                sync: false

          # ── Auth Service ──────────────────────────────────────────────────────
          - type: web
            name: fintrack-auth
            runtime: docker
            repo: https://github.com/Hieule-kid/FinTrack
            plan: free
            region: singapore
            dockerContext: .
            dockerfilePath: ./auth-service/Dockerfile
            autoDeployTrigger: commit
            envVars:
              - key: FINTRACK_DEV_ENV
                sync: false
              - key: POSTGRES_URL
                sync: false
              - key: POSTGRES_USERNAME
                sync: false
              - key: POSTGRES_PASSWORD
                sync: false
              - key: EUREKA_DEFAULT_ZONE
                sync: false
              - key: EUREKA_USERNAME
                sync: false
              - key: EUREKA_PASSWORD
                sync: false
              - key: FINTRACK_JWT_SECRET
                sync: false
              - key: RENDER_EXTERNAL_HOSTNAME
                fromService:
                  name: fintrack-auth
                  type: web
                  property: host

          # ── Planning Service ──────────────────────────────────────────────────
          - type: web
            name: fintrack-planning
            runtime: docker
            repo: https://github.com/Hieule-kid/FinTrack
            plan: free
            region: singapore
            dockerContext: .
            dockerfilePath: ./planning-service/Dockerfile
            autoDeployTrigger: commit
            envVars:
              - key: FINTRACK_DEV_ENV
                sync: false
              - key: POSTGRES_URL
                sync: false
              - key: POSTGRES_USERNAME
                sync: false
              - key: POSTGRES_PASSWORD
                sync: false
              - key: EUREKA_DEFAULT_ZONE
                sync: false
              - key: EUREKA_USERNAME
                sync: false
              - key: EUREKA_PASSWORD
                sync: false
              - key: FINTRACK_JWT_SECRET
                sync: false
              - key: GEMINI_API_KEY
                sync: false
              - key: RENDER_EXTERNAL_HOSTNAME
                fromService:
                  name: fintrack-planning
                  type: web
                  property: host

          # ── API Gateway ───────────────────────────────────────────────────────
          - type: web
            name: fintrack-gateway
            runtime: docker
            repo: https://github.com/Hieule-kid/FinTrack
            plan: free
            region: singapore
            dockerContext: .
            dockerfilePath: ./gateway-service/Dockerfile
            autoDeployTrigger: commit
            envVars:
              - key: FINTRACK_DEV_ENV
                sync: false
              - key: EUREKA_DEFAULT_ZONE
                sync: false
              - key: EUREKA_USERNAME
                sync: false
              - key: EUREKA_PASSWORD
                sync: false
              - key: FRONTEND_ORIGIN
                sync: false
              - key: RENDER_EXTERNAL_HOSTNAME
                fromService:
                  name: fintrack-gateway
                  type: web
                  property: host
