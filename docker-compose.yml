services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres        # default db; init.sql creates the app databases
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fintrack-net

  # ── pgAdmin 4 ───────────────────────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
    volumes:
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "8080:80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - fintrack-net

  # ── Eureka / Config Service ─────────────────────────────────────────────────
  config-service:
    build:
      context: .
      dockerfile: config-service/Dockerfile
    image: fintrack/config-service:latest
    restart: always
    environment:
      EUREKA_USERNAME: ${EUREKA_USERNAME}
      EUREKA_PASSWORD: ${EUREKA_PASSWORD}
      EUREKA_HOST: config-service
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://${EUREKA_USERNAME}:${EUREKA_PASSWORD}@localhost:8761/actuator/health | grep UP || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
    networks:
      - fintrack-net

  # ── Auth Service ────────────────────────────────────────────────────────────
  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    image: fintrack/auth-service:latest
    restart: always
    environment:
      POSTGRES_URL: postgresql://db:5432/fintrack_auth
      POSTGRES_USERNAME: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      EUREKA_HOST: config-service
      EUREKA_USERNAME: ${EUREKA_USERNAME}
      EUREKA_PASSWORD: ${EUREKA_PASSWORD}
      FINTRACK_JWT_SECRET: ${FINTRACK_JWT_SECRET}
    ports:
      - "8081:8081"
    depends_on:
      db:
        condition: service_healthy
      config-service:
        condition: service_healthy
    networks:
      - fintrack-net

  # ── Planning Service ────────────────────────────────────────────────────────
  planning-service:
    build:
      context: .
      dockerfile: planning-service/Dockerfile
    image: fintrack/planning-service:latest
    restart: always
    environment:
      POSTGRES_URL: postgresql://db:5432/fintrack_planning
      POSTGRES_USERNAME: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      EUREKA_HOST: config-service
      EUREKA_USERNAME: ${EUREKA_USERNAME}
      EUREKA_PASSWORD: ${EUREKA_PASSWORD}
      FINTRACK_JWT_SECRET: ${FINTRACK_JWT_SECRET}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    ports:
      - "8090:8090"
    depends_on:
      db:
        condition: service_healthy
      config-service:
        condition: service_healthy
    networks:
      - fintrack-net

  # ── API Gateway ─────────────────────────────────────────────────────────────
  gateway-service:
    build:
      context: .
      dockerfile: gateway-service/Dockerfile
    image: fintrack/gateway-service:latest
    restart: always
    environment:
      EUREKA_HOST: config-service
      EUREKA_USERNAME: ${EUREKA_USERNAME}
      EUREKA_PASSWORD: ${EUREKA_PASSWORD}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN}
    ports:
      - "8088:8080"
    depends_on:
      config-service:
        condition: service_healthy
      auth-service:
        condition: service_started
    networks:
      - fintrack-net

volumes:
  postgres_data:
  pgadmin_data:

networks:
  fintrack-net:
    driver: bridge
