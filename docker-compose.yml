services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  # Shared by auth-service and planning-service (in their own repos). Kept here
  # since config-service doesn't need a DB of its own, but this container is the
  # natural place to run it for full local-stack dev.
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres        # default db; init.sql creates the app databases
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fintrack-net

  # ── pgAdmin 4 ───────────────────────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:?Set PGADMIN_DEFAULT_EMAIL in .env}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?Set PGADMIN_DEFAULT_PASSWORD in .env}
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
    volumes:
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - fintrack-net

  # ── Eureka / Config Service ─────────────────────────────────────────────────
  config-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: fintrack/config-service:latest
    restart: always
    environment:
      EUREKA_USERNAME: ${EUREKA_USERNAME}
      EUREKA_PASSWORD: ${EUREKA_PASSWORD}
    ports:
      - "127.0.0.1:8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://${EUREKA_USERNAME}:${EUREKA_PASSWORD}@localhost:8761/actuator/health | grep UP || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
    networks:
      - fintrack-net

# auth-service and planning-service now live in their own repos
# (Auth_Service_FinTrack, Planning_Service_FinTrack), each with its own
# docker-compose.yml. To run the full stack locally, start this compose file
# first (db + pgadmin + config-service), then start each service's own
# compose file with EUREKA_HOST pointing at this machine.

volumes:
  postgres_data:
  pgadmin_data:

networks:
  fintrack-net:
    driver: bridge
