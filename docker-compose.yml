services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fintrack_auth          # default DB; other DBs are created by each service
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fintrack-net

  # ── pgAdmin 4 ───────────────────────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
      # Auto-register the PostgreSQL server on first launch
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
    volumes:
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "8080:80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - fintrack-net

  # ── Eureka / Config Service ─────────────────────────────────────────────────
  config-service:
    build:
      context: .
      dockerfile: config-service/Dockerfile
    image: fintrack/config-service:latest
    restart: always
    environment:
      EUREKA_USERNAME: eureka
      EUREKA_PASSWORD: eureka123
      EUREKA_HOST: config-service
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://eureka:eureka123@localhost:8761/actuator/health | grep UP || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
    networks:
      - fintrack-net

  # ── Auth Service ────────────────────────────────────────────────────────────
  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    image: fintrack/auth-service:latest
    restart: always
    environment:
      POSTGRES_URL: jdbc:postgresql://db:5432/fintrack_auth
      POSTGRES_USERNAME: postgres
      POSTGRES_PASSWORD: postgres
      EUREKA_HOST: config-service
      EUREKA_USERNAME: eureka
      EUREKA_PASSWORD: eureka123
      FINTRACK_JWT_SECRET: fintrack-super-secret-key-change-me-in-prod-123
    ports:
      - "8081:8081"
    depends_on:
      db:
        condition: service_healthy
      config-service:
        condition: service_healthy
    networks:
      - fintrack-net

  # ── API Gateway ─────────────────────────────────────────────────────────────
  gateway-service:
    build:
      context: .
      dockerfile: gateway-service/Dockerfile
    image: fintrack/gateway-service:latest
    restart: always
    environment:
      EUREKA_HOST: config-service
      EUREKA_USERNAME: eureka
      EUREKA_PASSWORD: eureka123
    ports:
      # Keep 8080 for pgAdmin, expose gateway on 8088
      - "8088:8080"
    depends_on:
      config-service:
        condition: service_healthy
      auth-service:
        condition: service_started
    networks:
      - fintrack-net

volumes:
  postgres_data:
  pgadmin_data:

networks:
  fintrack-net:
    driver: bridge
