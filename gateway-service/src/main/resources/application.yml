server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      # Global timeout defaults for all routes
      httpclient:
        connect-timeout: ${GATEWAY_CONNECT_TIMEOUT_MS:3000}
        response-timeout: ${GATEWAY_RESPONSE_TIMEOUT:10s}
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - "${FRONTEND_ORIGIN:http://localhost:3000}"
            allowedMethods: ["GET","POST","PUT","PATCH","DELETE","OPTIONS"]
            allowedHeaders: ["Authorization", "Content-Type", "X-Requested-With"]
            allowCredentials: true
            maxAge: 3600
      routes:
        - id: auth-service-route
          uri: lb://auth-service
          predicates:
            - Path=/api/v1/auth/**
          metadata:
            connect-timeout: ${AUTH_ROUTE_CONNECT_TIMEOUT_MS:3000}
            response-timeout: ${AUTH_ROUTE_RESPONSE_TIMEOUT_MS:10000}
        - id: user-service-route
          uri: lb://auth-service
          predicates:
            - Path=/api/v1/users/**
          metadata:
            connect-timeout: ${AUTH_ROUTE_CONNECT_TIMEOUT_MS:3000}
            response-timeout: ${AUTH_ROUTE_RESPONSE_TIMEOUT_MS:10000}
        - id: planning-service-route
          uri: lb://planning-service
          predicates:
            - Path=/api/v1/plans/**
          metadata:
            connect-timeout: ${PLANNING_ROUTE_CONNECT_TIMEOUT_MS:3000}
            response-timeout: ${PLANNING_ROUTE_RESPONSE_TIMEOUT_MS:10000}

# Public auth endpoints are limited at the edge before they are forwarded to auth-service.
# This in-memory limiter is per gateway instance; use a Redis-backed limiter when scaling out.
fintrack:
  gateway:
    rate-limit:
      ttl-seconds: ${AUTH_RATE_LIMIT_TTL_SECONDS:60}
      login-per-window: ${AUTH_LOGIN_RATE_LIMIT:10}
      register-per-window: ${AUTH_REGISTER_RATE_LIMIT:5}
      refresh-per-window: ${AUTH_REFRESH_RATE_LIMIT:20}
      trust-forwarded-for: ${TRUST_X_FORWARDED_FOR:false}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://${EUREKA_USERNAME:eureka}:${EUREKA_PASSWORD:eureka123}@${EUREKA_HOST:localhost}:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: false
    hostname: ${RENDER_EXTERNAL_HOSTNAME:localhost}
    non-secure-port: ${server.port}
    instance-id: ${spring.application.name}:${server.port}

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.springframework.cloud.gateway: INFO
    reactor.netty.http.client: INFO
