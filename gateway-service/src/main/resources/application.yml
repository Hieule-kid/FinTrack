server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      # Global timeout defaults for all routes
      httpclient:
        connect-timeout: ${GATEWAY_CONNECT_TIMEOUT_MS:3000}
        response-timeout: ${GATEWAY_RESPONSE_TIMEOUT:10s}
      routes:
        - id: auth-service-route
          uri: lb://auth-service
          predicates:
            - Path=/api/v1/auth/**
          # Route-specific timeout override (milliseconds)
          metadata:
            connect-timeout: ${AUTH_ROUTE_CONNECT_TIMEOUT_MS:3000}
            response-timeout: ${AUTH_ROUTE_RESPONSE_TIMEOUT_MS:10000}

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_USERNAME:eureka}:${EUREKA_PASSWORD:eureka123}@${EUREKA_HOST:localhost}:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.springframework.cloud.gateway: INFO
    reactor.netty.http.client: INFO

